name: Resume documents
on:
  push:
    branches: [main]
    paths:
      - 'data/resume.json'
      - 'scripts/build_resume.py'
      - 'tests/check_resume.py'
      - '.github/workflows/resume-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resume-documents
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab==4.4.4 python-docx==1.2.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python scripts/build_resume.py
      - run: python tests/check_resume.py
      - uses: actions/upload-artifact@v4
        with:
          name: resume-documents
          path: downloads/
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads data/resume-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: regenerate bilingual career documents"
          git push origin HEAD:main
