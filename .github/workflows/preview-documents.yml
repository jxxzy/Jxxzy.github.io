name: Resume visual previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-documents.yml'
      - 'scripts/render_previews.py'
      - 'data/resume.json'
      - 'downloads/*.pdf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resume-previews
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils libreoffice-writer
      - run: python scripts/render_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-sheets
          path: review/
      - name: Publish first-page PDF previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish resume first-page previews"
          git push origin HEAD:main
