name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages and local links
        run: python3 tests/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/premium.js

          node --check assets/js/resume.js

          node --check assets/js/ultimate.js
          node --check assets/js/site-v5.js
          node --check sw.js
      - name: Validate V5 features
        run: python3 tests/check_v5.py
