name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages and local links
        run: python3 tests/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/premium.js
